id: trace
message: trace
severity: info
language: verilog
rule:
  pattern: $$A
  regex: \bheu_estim_stream\b
  any:
    - kind: simple_identifier
    inside:
    any:
    - kind: list_of_port_declarations
    - kind: input_declaration
    stopBy: end
    - kind: net_lvalue
    inside:
    kind: net_assignment
    - kind: variable_lvalue
    inside:
    kind: case_statement
    stopBy: end
    - kind: variable_lvalue
    inside:
    kind: conditional_statement
    stopBy: end
    - kind: variable_lvalue
    inside: expression
    any:
    - kind: named_port_connection
    - kind: ordered_port_connection
    stopBy: end
    inside:
    kind: module_instantiation
    stopBy: end
    - kind: simple_identifier
    inside:
    kind: module_instantiation
